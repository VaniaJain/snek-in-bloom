name: pygbag_build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build and deploy Snek in Bloom
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag==0.9.3

      - name: Prepare clean game directory
        run: |
          mkdir -p /tmp/snek-web
          cp main.py /tmp/snek-web/main.py
          if [ -f best_score.json ]; then
            cp best_score.json /tmp/snek-web/best_score.json
          fi

      - name: Build browser game
        run: |
          cd /tmp/snek-web
          python -m pygbag --build main.py

      - name: Verify browser build
        run: |
          test -f /tmp/snek-web/build/web/index.html
          echo "Browser build generated successfully."
          ls -lah /tmp/snek-web/build/web
          
      - name: Fix paths for GitHub Pages subdirectory
        run: |
          # Convert root-relative paths to relative paths so they work in a GitHub subfolder
          sed -i 's|src="/|src="./|g' /tmp/snek-web/build/web/index.html
          sed -i 's|href="/|href="./|g' /tmp/snek-web/build/web/index.html
          # Alternatively, inject a base tag right after <head>
          sed -i 's|<head>|<head><base href="./">|g' /tmp/snek-web/build/web/index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: /tmp/snek-web/build/web
          clean: true
