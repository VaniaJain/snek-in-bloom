
name: pygbag_build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pygbag and build game
        run: |
          python -m pip install pygbag
          python -m pygbag --disable-sound-format-error --build "$GITHUB_WORKSPACE/main.py"

      - name: Deploy to GitHub Pages branch gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
