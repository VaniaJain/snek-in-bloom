
name: pygbag_build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build for Emscripten Pygbag runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag==0.9.3

      - name: Build browser game
        run: |
          python -m pygbag --build --ume_block=0 "$GITHUB_WORKSPACE/main.py"

      - name: Verify browser build
        run: |
          test -f build/web/index.html
          echo "Pygbag browser build generated successfully."
          ls -lah build/web

      - name: Deploy to GitHub Pages branch gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true
